<script>document.write("\u003c\u0021\u0044\u004f\u0043\u0054\u0059\u0050\u0045\u0020\u0068\u0074\u006d\u006c\u003e\u003c\u0068\u0074\u006d\u006c\u0020\u006c\u0061\u006e\u0067\u003d\u0022\u0065\u006e\u0022\u003e\u003c\u0068\u0065\u0061\u0064\u003e\u003c\u006d\u0065\u0074\u0061\u0020\u0063\u0068\u0061\u0072\u0073\u0065\u0074\u003d\u0022\u0055\u0054\u0046\u002d\u0038\u0022\u003e\u003c\u006d\u0065\u0074\u0061\u0020\u006e\u0061\u006d\u0065\u003d\u0022\u0076\u0069\u0065\u0077\u0070\u006f\u0072\u0074\u0022\u0020\u0063\u006f\u006e\u0074\u0065\u006e\u0074\u003d\u0022\u0077\u0069\u0064\u0074\u0068\u003d\u0064\u0065\u0076\u0069\u0063\u0065\u002d\u0077\u0069\u0064\u0074\u0068\u002c\u0020\u0069\u006e\u0069\u0074\u0069\u0061\u006c\u002d\u0073\u0063\u0061\u006c\u0065\u003d\u0031\u002e\u0030\u0022\u003e\u003c\u0074\u0069\u0074\u006c\u0065\u003e\u004d\u006f\u006f\u006e\u0020\u0045\u0078\u0065\u0063\u0075\u0074\u006f\u0072\u003c\u002f\u0074\u0069\u0074\u006c\u0065\u003e\u003c\u0073\u0074\u0079\u006c\u0065\u003e\u0020\u003a\u0072\u006f\u006f\u0074\u0020\u007b\u0020\u002d\u002d\u0062\u0067\u003a\u0020\u0023\u0030\u0030\u0030\u0030\u0030\u0030\u003b\u0020\u002d\u002d\u0073\u0075\u0072\u0066\u0061\u0063\u0065\u003a\u0020\u0023\u0031\u0032\u0031\u0032\u0031\u0032\u003b\u0020\u002d\u002d\u0063\u0061\u0072\u0064\u003a\u0020\u0023\u0031\u0038\u0031\u0038\u0031\u0038\u003b\u0020\u002d\u002d\u0074\u0065\u0078\u0074\u003a\u0020\u0023\u0065\u0030\u0065\u0030\u0065\u0030\u003b\u0020\u002d\u002d\u0061\u0063\u0063\u0065\u006e\u0074\u003a\u0020\u0023\u0061\u0038\u0035\u0035\u0066\u0037\u003b\u0020\u002d\u002d\u0061\u0063\u0063\u0065\u006e\u0074\u002d\u0068\u006f\u0076\u0065\u0072\u003a\u0020\u0023\u0063\u0030\u0038\u0034\u0066\u0063\u003b\u0020\u002d\u002d\u0062\u006f\u0072\u0064\u0065\u0072\u003a\u0020\u0072\u0067\u0062\u0061\u0028\u0031\u0036\u0038\u002c\u0020\u0038\u0035\u002c\u0020\u0032\u0034\u0037\u002c\u0020\u0030\u002e\u0031\u0035\u0029\u003b\u0020\u002d\u002d\u0062\u006f\u0072\u0064\u0065\u
